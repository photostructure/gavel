name: CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.6.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run lint and typecheck
        run: pnpm run check

      - name: Run formatting check
        run: pnpm run format

      - name: Run knip
        run: pnpm run knip

      - name: Run tests
        run: pnpm test

      - name: Build package
        run: pnpm run build

      - name: Rehearse the publishing package path
        run: node scripts/release-package.mjs pack package-artifact

      - name: Verify build and packaging preserved tracked sources
        run: git diff --exit-code

      - name: Share the verified consumer package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package-check
          path: package-artifact/
          if-no-files-found: error
          retention-days: 1

  package-acceptance:
    name: Package acceptance (${{ matrix.os }}, Node ${{ matrix.node }})
    needs: ci
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            node: 22.14.0
          - os: ubuntu-24.04
            node: 24.22.1
          - os: macos-15
            node: 24.22.1
          - os: windows-2025
            node: 24.22.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Give the minimum Node lane an npm with dependency cooldown support
        if: matrix.node == '22.14.0'
        # Node 22.14 bundles npm 10, which cannot enforce the consumer cooldown.
        # Pin the aged CLI (published 2026-08-26) and disable installation scripts.
        # This job executes the untrusted candidate package with contents: read
        # only, no secrets, no persisted Git credentials and no OIDC permission.
        run: npm install --global npm@11.19.1 --ignore-scripts --no-audit --no-fund # zizmor: ignore[adhoc-packages]
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package-check
          path: package-artifact
      - name: Install and invoke the packed CLI
        run: node scripts/release-package.mjs rehearse package-artifact
