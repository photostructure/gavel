name: Stage npm Release
run-name: Stage ${{ github.ref_name }}

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stage-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      package_version: ${{ steps.identity.outputs.package_version }}
      tag_object_sha: ${{ steps.identity.outputs.tag_object_sha }}
    steps:
      - name: Require the fork release tag before checkout
        run: |
          if [[ ! "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo '::error::Dispatch this workflow at a vMAJOR.MINOR.PATCH tag'
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate package identity and verified signatures
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release-validate-tag.sh

  pack:
    runs-on: ubuntu-24.04
    needs: validate
    env:
      EXPECTED_PACKAGE_VERSION: ${{ needs.validate.outputs.package_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.6.0
          run_install: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run build
      - name: Pack and verify the exact release package
        run: node scripts/release-package.mjs pack package-artifact
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package-${{ github.ref_name }}
          path: package-artifact/
          if-no-files-found: error
          retention-days: 1

  stage:
    runs-on: ubuntu-24.04
    needs: [validate, pack]
    permissions:
      contents: read
      id-token: write
    env:
      EXPECTED_PACKAGE_VERSION: ${{ needs.validate.outputs.package_version }}
      EXPECTED_TAG_OBJECT_SHA: ${{ needs.validate.outputs.tag_object_sha }}
    steps:
      # Only the dependency-free verifier and the manifest it reads; the
      # package itself is checked as data and never installed or run here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            /package.json
            /scripts/release-package.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package-${{ github.ref_name }}
          path: package-artifact
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Verify the downloaded package as data
        run: node scripts/release-package.mjs verify package-artifact
      - name: Recheck the signed tag and stage the exact package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REF_JSON="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME")"
          if [[ "$(jq -r '.object.type' <<< "$REF_JSON")" != tag || "$(jq -r '.object.sha' <<< "$REF_JSON")" != "$EXPECTED_TAG_OBJECT_SHA" ]]; then
            echo '::error::Release tag changed after validation'
            exit 1
          fi
          TAG_JSON="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$EXPECTED_TAG_OBJECT_SHA")"
          COMMIT_VERIFIED="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" --jq '.commit.verification.verified')"
          if [[ "$(jq -r '.object.type' <<< "$TAG_JSON")" != commit || "$(jq -r '.object.sha' <<< "$TAG_JSON")" != "$GITHUB_SHA" || "$(jq -r '.verification.verified' <<< "$TAG_JSON")" != true || "$COMMIT_VERIFIED" != true ]]; then
            echo '::error::Release tag moved or lost a verified signature'
            exit 1
          fi
          mapfile -t TARBALLS < <(find package-artifact -maxdepth 1 -type f -name '*.tgz')
          [[ "${#TARBALLS[@]}" -eq 1 ]]
          npm stage publish "./${TARBALLS[0]}" --ignore-scripts --access public

  github-release:
    runs-on: ubuntu-24.04
    needs: stage
    permissions:
      actions: write # Start github-release.yaml at this tag.
    steps:
      - name: Start the GitHub release workflow, which waits for npm approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run github-release.yaml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
